# nginx for the ui Deployment. Replaces /etc/nginx/nginx.conf in your image.
#
# Built to run as a non-root user with readOnlyRootFilesystem: true (section 4.7).
# - It listens on 8080, because a non-root process cannot bind ports below 1024.
# - Everything nginx writes (pid, temp files) goes under /tmp, so mount an
#   emptyDir volume at /tmp in your Deployment.
# - Logs go to stdout and stderr (section 4.8).
#
# The API is NOT proxied here: your Ingress routes /api to the api Service.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Browser security headers. The page may only load its own files and only call its
        # own /api; no inline script can run, and no other site may frame it.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        # Small files: always revalidate, so a new release shows up on the next reload.
        add_header Cache-Control "no-cache" always;

        # For the ui container's own probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri /index.html;
        }
    }
}

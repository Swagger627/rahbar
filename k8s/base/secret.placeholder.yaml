# SHAPE ONLY. This file documents the Secret the api reads; its value is a placeholder.
# It is deliberately NOT listed in kustomization.yaml: applying it would overwrite the
# real Secret with REPLACE_ME (STARTER.md, "Secrets").
#
# Create the real Secret from the command line, never from a file you commit:
#   $env:LLM_API_KEY = "<your key>"      # PowerShell; the key stays in this terminal
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$env:LLM_API_KEY"
# (or `make secret`). Base64 in a Secret is encoding, not encryption.
#
# Only needed when LLM_PROVIDER=hosted. With the stub or Ollama no key is used, and the
# api starts without this Secret because its reference is marked optional.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME

# The weekly re-index (section 4.1) and the one-command manual re-index (section 4.2):
#
#   kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
#
# It runs the REAL pipeline (python -m pipeline.run, no --dummy), the only writer to
# Chroma, on the same corpus PVC as the first indexer Job (indexer-job.yaml), and checks
# every PDF's SHA-256 before indexing.
#
# SUSPENDED on purpose until the first real index has been proven on the live cluster.
# Then turn the weekly schedule on (docs/DEPLOYMENT.md, "Scheduled re-index"):
#   kubectl patch cronjob reindex -n rahbar -p '{"spec":{"suspend":false}}'
apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
spec:
  # Every Sunday at 03:00 (cluster time).
  schedule: "0 3 * * 0"
  suspend: true
  # Never start a second re-index while one is still running: Chroma has one writer.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: indexer
        spec:
          restartPolicy: OnFailure
          serviceAccountName: indexer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: rahbar-config
              # Embedding a corpus needs far more memory than serving a query; these
              # starting values must be checked against `kubectl top pods` (section 4.5).
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: corpus
                  mountPath: /corpus
                  readOnly: true
                - name: tmp          # pdf2image writes page images here for OCR
                  mountPath: /tmp
          volumes:
            - name: corpus
              persistentVolumeClaim:
                claimName: corpus
                readOnly: true
            - name: tmp
              emptyDir: {}

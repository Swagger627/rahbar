# The list of RAHBAR manifests. `kubectl apply -k k8s/overlays/dev` applies them all,
# and every object is placed in the rahbar namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - namespace.yaml
  - configmap.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - reindex-cronjob.yaml
  - services.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml
# secret.placeholder.yaml is deliberately NOT listed: applying it would replace the
# real Secret with REPLACE_ME. Create the real one with `kubectl create secret`.

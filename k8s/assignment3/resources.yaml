apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragops-results
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragops-traces
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ragops-eval
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-gate
data:
  thresholds.json: |
    {
      "recall5_max_drop": 0.02,
      "faithfulness_min": 0.50,
      "latency_p95_max_seconds": 120.0,
      "abstention_max_drop": 0.0,
      "citation_validity_min": 0.95,
      "answerable_answer_rate_min": 0.40
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-eval-target
data:
  # `kubectl apply -f k8s/eval-job.yaml` tests the candidate against the recorded baseline
  # (/results/a3-baseline.json) and fails the Job when the release gate fails. The baseline
  # itself is recorded once with: bash scripts/ragops-k8s.sh eval baseline api
  EVAL_API: http://api-candidate:8000
  EVAL_PHASE: candidate
  EVAL_GOLDEN: /suite/golden.jsonl

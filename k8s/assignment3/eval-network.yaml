apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ragops-eval
spec:
  podSelector:
    matchLabels:
      app: ragops-eval
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - ipBlock:
            cidr: 192.168.65.254/32
      ports:
        - {protocol: TCP, port: 11434}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-eval
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ragops-eval
      ports:
        - {protocol: TCP, port: 8000}

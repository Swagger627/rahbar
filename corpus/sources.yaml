# RAHBAR corpus: public FAST-NUCES documents (nu.edu.pk), verified on 3 November 2026.
#
#   python corpus/fetch.py            # download into corpus/raw/ (gitignored), write MANIFEST.md
#   python corpus/fetch.py --verify   # re-hash local files against corpus/MANIFEST.md
#
# The PDFs are not ours, so they are never committed: MANIFEST.md records each URL and
# SHA-256 instead. doc_version and superseded become chunk metadata (section 3.1).
# docs/CORPUS.md explains why each document is here and what was checked.
#
# Deliberately absent (property 6): detailed hostel rules, hostel fees and hostel
# application procedures. The Prospectus "Transport and Hostel Facilities" PDF is left
# out on purpose. Basic hostel availability IS mentioned in the Student Handbook and the
# Annual Report, so questions about which campuses have hostels are answerable.

documents:

  # Property 2: two versions of the same policy, "Undergraduate Academic Rules and
  # Regulations". Property 3 as well: this edition has no text layer and needs OCR.
  - name: Undergraduate Academic Rules (Aug 2023)
    url: http://nu.edu.pk/public/downloads/Academic-Rules-Undergrad-Aug-2023.pdf
    doc_version: "2023-08"
    superseded: true
    notes: >-
      26 pages. Cover title "Undergraduate Academic Rules and Regulations 2023".
      Superseded status is INFERRED: the university's current Downloads page lists only
      the 2026 edition under "Undergraduate Academic Rules & Regulations"; neither
      edition states that it supersedes the other.

  - name: Academic Rules Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Academic_Rules_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false
    notes: 58 pages. Title page "Undergraduate Academic Rules and Regulations 2026"; current edition.

  # Property 7: the same current rules with different clause numbers (attendance is
  # clause 1 here, 1.21 in the handbook). A parallel summary, not an older version.
  - name: Prospectus 2026 - Academic Rules and Regulations
    url: https://www.nu.edu.pk/Admissions/ProspectusUpload/Academic Rules and Regulations.pdf
    doc_version: "2026"
    superseded: false
    notes: 5 pages; its first page is numbered 217 in the printed prospectus.

  # Property 5: long definitions, including the Policy on Generative AI Based Tools.
  - name: Student Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Student_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false
    notes: 64 pages.

  # Property 4: tables (for example degree programmes by campus, PDF page 11).
  - name: Annual Report 2023-24
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2023-24.pdf
    doc_version: "2023-24"
    superseded: false
    notes: 85 pages. A yearly report, not a version of a policy.

  # Properties 4 and 7: fee amounts in a table and in prose.
  - name: Prospectus 2026 - Fee Information
    url: https://www.nu.edu.pk/Admissions/ProspectusUpload/Fee Information.pdf
    doc_version: "2026-27"
    superseded: false
    notes: 1 page (prospectus page 213); tuition for the 2026-27 academic year.

  # Property 3: a genuine image-only scan, with no fonts and no text on any page.
  - name: Faculty Entrepreneurship and Technical Start-ups Policy
    url: https://nu.edu.pk/OricResources/ResearchPolicies/27.pdf?20220530
    doc_version: "2022-05"
    superseded: false
    notes: 8 pages, scanned at about 300 dpi; dated 30.05.2022 in its header.
